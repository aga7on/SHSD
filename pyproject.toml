[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shsd"
version = "0.1.0"
description = "CPU-first streaming hierarchical semantic decoder for audio and video."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=19.0.1,<20",
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=1.3,<2",
  "httpx>=0.27,<1",
  "mypy>=1.11",
  "psutil>=6,<8",
  "py-cpuinfo>=9,<10",
  "pytest>=8.3",
  "requests>=2.32,<3",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]
embedding = [
  "sentence-transformers[image]>=6.2,<7",
  "threadpoolctl>=3.6,<4",
  "transformers>=5,<6",
  "huggingface-hub>=1.3,<2",
]
asr = [
  "hydra-core>=1.3,<1.4",
  "huggingface-hub>=1.3,<2",
  "omegaconf>=2.3,<2.4",
  "sentencepiece>=0.2,<0.3",
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "transformers>=5,<6",
]
api = [
  "fastapi>=0.115,<1",
  "psutil>=6,<8",
  "uvicorn>=0.30,<1",
]

[project.scripts]
shsd = "shsd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shsd.api" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["models"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
